name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p "$RUNNER_TEMP/portfolio-site"
          cp index.html "$RUNNER_TEMP/portfolio-site/"
          cp -R assets "$RUNNER_TEMP/portfolio-site/assets"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/portfolio-site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
